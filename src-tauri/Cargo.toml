[package]
name = "Prisma"
version = "1.3.0"
description = "Prisma Desktop"
authors = ["you"]
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "prisma_desktop_lib"
path = "core/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Prisma"
path = "core/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "8"
# Та же схема, что у tauri-plugin-updater: rustls без встроенного провайдера
# плюс явный rustls с ring. Так в дереве один reqwest и один криптопровайдер,
# без aws-lc-rs (ему нужны cmake и nasm на Windows). Корневые сертификаты
# берутся из системы через rustls-platform-verifier.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider", "charset", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rfd = "0.15"
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# Размер и скорость релизного бинарника: LTO и один codegen-unit дают
# межкрейтовую оптимизацию, strip убирает символы, panic=abort — unwind-таблицы.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
