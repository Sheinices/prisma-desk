# Настройки cargo-deny для CI (.github/workflows/ci.yml).
# Уязвимости остаются ошибками; исключения ниже — только для advisories,
# которые мы не можем закрыть сами, каждое с причиной и датой пересмотра.

[advisories]
version = 2
ignore = [
  # unic-ucd-version не поддерживается, но тянется цепочкой
  # tauri-utils → urlpattern → unic-ucd-ident. Обновления нет ни у нас,
  # ни у Tauri. Убрать, когда tauri-utils уйдёт с urlpattern 0.3.
  { id = "RUSTSEC-2025-0098", reason = "transitive via tauri-utils/urlpattern, no upgrade available (checked 2026-10)" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
