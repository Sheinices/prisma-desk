# Настройки cargo-deny для CI (.github/workflows/ci.yml).
# Уязвимости остаются ошибками; исключения ниже — только для advisories,
# которые мы не можем закрыть сами, каждое с причиной и датой пересмотра.

[advisories]
version = 2
ignore = [
  # proc-macro-error заброшен, но тянется через GTK-биндинги (glib-macros) на Linux
  # (см. `cargo tree -i proc-macro-error --target all`). Это макрос времени
  # компиляции, в бинарник не попадает. Убрать, когда исчезнет из дерева.
  { id = "RUSTSEC-2024-0370", reason = "transitive build-time proc-macro via Tauri deps, no upgrade available (checked 2026-10)" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
