<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prisma - выбор зеркала</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="setup">
      <div class="setup__card">
        <h1 class="setup__title">Prisma</h1>

        <section id="splash" class="setup__splash">
          <div class="spinner"></div>
          <p id="splash-text">Проверяем сохранённое зеркало…</p>
        </section>

        <section id="form" class="setup__form" hidden>
          <p class="setup__hint">
            Укажите адрес зеркала Prisma. Он сохранится и будет открываться при запуске.
          </p>

          <input
            id="url-input"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="http://prisma.ws"
          />

          <p id="status" class="setup__status"></p>

          <div class="setup__row">
            <button id="continue" class="btn btn--primary" type="button">
              Проверить и продолжить
            </button>
            <button id="reset" class="btn btn--ghost" type="button">По умолчанию</button>
          </div>

          <button id="skip" class="setup__skip" type="button">
            Открыть без проверки
          </button>
        </section>
      </div>
    </main>
  </body>
</html>
