<meta charset="utf-8">
<title>Prisma isolated media test</title>
<div id="player"></div>
<script>
  const results = [], calls = [], contexts = [], channels = [], notifications = [];
  const NativeContext = window.AudioContext;
  // Observe actual Web Audio output, then silence it before the speakers.
  window.AudioContext = function (options) {
    const actual = new NativeContext(options);
    const analyser = actual.createAnalyser(); analyser.fftSize = 2048;
    const silence = actual.createGain(); silence.gain.value = 0;
    analyser.connect(silence); silence.connect(actual.destination);
    contexts.push({ actual, analyser });
    return new Proxy(actual, { get(target, key) {
      if (key === "destination") return analyser;
      if (key === "createBuffer") return (...args) => { channels.push(args[0]); return target.createBuffer(...args); };
      const value = Reflect.get(target, key, target);
      return typeof value === "function" ? value.bind(target) : value;
    } });
  };
  window.__TAURI__ = { core: { async invoke(name, args) {
    calls.push({ name, ...args });
    const response = await fetch(`/api/${name}`, { method: "POST", body: JSON.stringify(args) });
    if (!response.ok) throw (await response.json()).message;
    return (name === "media_audio_read" || name === "media_video_read" || name === "media_subtitle_read") ? response.arrayBuffer() : response.json();
  } } };
  let video, tracks, subtitleText = "";
  const player = {
    url(url) {
      video = document.createElement("video"); video.muted = true;
      video.addEventListener("subtitle", (event) => { subtitleText = event.text; });
      video.src = url; video.playsInline = true; video.volume = 1;
      document.querySelector("#player").append(video);
      video.play().catch(() => {});
    },
    video: () => video,
    saveParams: () => ({}),
    listener: { send(type, data) { if (type === "tracks") tracks = data.tracks; } },
    destroy() { video.pause(); video.removeAttribute("src"); video.load(); video.remove(); },
  };
  window.Prisma = { PlayerVideo: player, Noty: { show: (message) => notifications.push(message) } };
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  function check(condition, message) { if (!condition) throw new Error(message); results.push(message); }
  async function waitFor(condition, message, timeout = 10000) {
    const end = Date.now() + timeout;
    while (Date.now() < end) { if (condition()) return; await sleep(50); }
    throw new Error(`${message}: ${JSON.stringify({ time: video?.currentTime, paused: video?.paused, ready: video?.readyState, error: video?.error?.code, bridge: window.__prismaMediaAudio.status(), notifications, subtitleText, results, cues: Array.from(video?.textTracks?.[0]?.cues || []).map((cue) => [cue.startTime, cue.endTime, cue.text]), starts: calls.filter((call) => call.name.endsWith("_start")), calls: calls.slice(-8) })}`);
  }
  function energy() {
    const analyser = contexts[0]?.analyser; if (!analyser) return 0;
    const data = new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(data);
    return Math.sqrt(data.reduce((sum, value) => sum + value * value, 0) / data.length);
  }
  function frequency() {
    const { actual, analyser } = contexts[0];
    const data = new Float32Array(analyser.frequencyBinCount); analyser.getFloatFrequencyData(data);
    let maximum = 0; for (let i = 1; i < data.length; i++) if (data[i] > data[maximum]) maximum = i;
    return maximum * actual.sampleRate / analyser.fftSize;
  }
  async function run() {
    const testUrl = __MEDIA_URL_JSON__;
    player.url(testUrl);
    await waitFor(() => window.__prismaMediaAudio.status().active && tracks?.length === 2, "bridge/track discovery", 25000);
    video.muted = false;
    await waitFor(() => !video.paused && video.currentTime > 0.3 && energy() > 0.01, "audible PCM graph");
    if (new URL(testUrl).origin !== location.origin) {
      check(video.videoWidth > 0 && video.videoHeight > 0, "TorrServer MKV video decoded");
      check(calls.some((call) => call.name === "media_video_start"), "MKV remux path used");
      check(energy() > 0.01, "TorrServer audio decoded");
      video.currentTime = 60;
      video.play().catch(() => {});
      await waitFor(() => video.currentTime > 60.2 && energy() > 0.001, "TorrServer seek/resume", 20000);
      check(calls.some((call) => call.name === "media_video_start" && call.start > 59), "seek restarts video at requested timeline");
      await waitFor(() => video.customSubs?.length > 0, "TorrServer subtitle tracks");
      video.customSubs[0].mode = "showing";
      await waitFor(() => video.textTracks[0]?.cues?.length > 0, "TorrServer subtitle extraction", 20000);
      check(video.textTracks[0].cues[0].startTime >= 40, "embedded subtitles retain the requested timeline");
      player.destroy(); await sleep(200);
      check(contexts[0].actual.state === "closed" && notifications.length === 0, "TorrServer teardown/no errors");
      return { ok: true, results };
    }
    if (testUrl.endsWith(".mkv")) {
      await waitFor(() => video.customSubs?.length === 1, "embedded subtitle discovery");
      video.pause(); video.currentTime = 1;
      video.customSubs[0].mode = "showing";
      await waitFor(() => subtitleText.includes("Тестовые субтитры"), "embedded subtitle rendering");
      check(subtitleText.includes("Тестовые субтитры"), "embedded UTF-8 subtitles rendered");
      video.play().catch(() => {});
      await waitFor(() => !video.paused && energy() > 0.01, "resume after subtitle check");
    }
    check(video.videoWidth === 128, "real video decoded");
    check(Math.abs(frequency() - 440) < 50, "AC3 decoded to the Web Audio graph");
    check(Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, "muted").get.call(video), "native audio remains silenced");
    video.pause(); const position = video.currentTime;
    await sleep(250);
    check(Math.abs(video.currentTime - position) < 0.05 && energy() < 0.001, "pause stops both clocks/output");
    video.currentTime = location.pathname && calls.some((c) => c.name === "media_video_start") ? 14.375 : 4.375;
    video.play().catch(() => {});
    await waitFor(() => video.currentTime > (calls.some((c) => c.name === "media_video_start") ? 14.5 : 4.5) && energy() > 0.01, "seek/resume audio");
    check(calls.some((c) => c.name === "media_audio_start" && Math.abs(c.start - (calls.some((call) => call.name === "media_video_start") ? 14.375 : 4.375)) < 0.15), "seek uses the video timeline");
    if (testUrl.endsWith(".mkv")) {
      await waitFor(() => subtitleText.includes("После перемотки"), "subtitles after seek");
      check(subtitleText.includes("После перемотки"), "subtitle timeline preserved after seek");
      video.customSubs[0].mode = "disabled";
      check(subtitleText === "", "subtitle off clears text");
    }
    tracks.forEach((track) => { track.enabled = false; track.selected = false; });
    tracks[1].enabled = true; tracks[1].selected = true;
    await waitFor(() => window.__prismaMediaAudio.status().codec === "eac3" && channels.includes(6) && Math.abs(frequency() - 880) < 50 && energy() > 0.005, "EAC3 track/5.1 output");
    check(channels.includes(6), "six PCM channels retained");
    video.playbackRate = 1.5;
    await waitFor(() => calls.some((c) => c.name === "media_audio_start" && c.rate === 1.5) && energy() > 0.005 && Math.abs(frequency() - 880) < 50, "speed/pitch");
    check(Math.abs(frequency() - 880) < 50, "1.5x speed preserves pitch");
    video.muted = true;
    await sleep(250);
    check(energy() < 0.001, "mute silences PCM");
    video.muted = false;
    await waitFor(() => energy() > 0.005, "unmute");
    player.destroy(); await sleep(200);
    check(contexts[0].actual.state === "closed" && !window.__prismaMediaAudio.status().active, "teardown closes audio output");
    check(notifications.length === 0, "no playback errors");
    return { ok: true, results };
  }
</script>
<script src="/media-audio.js"></script>
<script>
  run().then((result) => window.webkit.messageHandlers.testResult.postMessage(result))
    .catch((error) => { player.destroy(); window.webkit.messageHandlers.testResult.postMessage({ ok: false, error: error.message, results }); });
</script>
