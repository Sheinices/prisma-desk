name: Release Update

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-updater-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
          - platform: macos-14
            target: x86_64-apple-darwin
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-2022
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    # Linux — в контейнере Ubuntu 22.04 ради старого glibc, подробности в main.yml.
    container: ${{ matrix.platform == 'ubuntu-24.04' && 'ubuntu:22.04' || '' }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          apt-get update
          apt-get install -y \
            build-essential curl wget file git pkg-config patchelf xdg-utils \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            gstreamer1.0-gl

      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: npm ci

      - name: Configure macOS signing
        if: matrix.platform == 'macos-14'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/setup-macos-signing.sh

      # На macOS-раннерах bundle_dmg.sh изредка падает на hdiutil (гонка за /Volumes):
      # в одном и том же прогоне arm64 собирается, а x64 падает за 6 секунд без вывода.
      # Поэтому первая попытка не роняет job, а повторная идёт по прогретому кэшу.
      - name: Build and publish release assets
        id: release
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ключ апдейтера: без него не будет .sig и latest.json, и автообновление
          # у пользователей перестаёт находить релиз.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Prisma Desktop ${{ github.ref_name }}
          releaseBody: |
            ## Какую сборку скачать

            | Система | Для какого компьютера | Файл для установки |
            | --- | --- | --- |
            | macOS — Apple Silicon | Mac с чипом Apple M-серии (M1, M2, M3, M4 и новее), ARM64 | `Prisma_*_aarch64.dmg` |
            | macOS — Intel | Mac с процессором Intel, x64 | `Prisma_*_x64.dmg` |
            | Windows | ПК с процессором Intel или AMD, x64 | `Prisma_*_x64-setup.exe` или `Prisma_*_x64_en-US.msi` |
            | Windows — без установки | ПК с процессором Intel или AMD, x64 | `Prisma-portable-x64.zip` |
            | Linux | ПК с процессором Intel или AMD, x64 | `*_amd64.deb` или `*.x86_64.rpm` |

            На Mac тип процессора можно посмотреть в меню Apple → «Об этом Mac».
            `aarch64` означает ARM64 — это сборка для Apple Silicon.

            Файлы `.sig`, `latest.json` и `.app.tar.gz` предназначены для автообновления.
            Для обычной установки на Mac скачайте `.dmg`.
          releaseDraft: false
          prerelease: false
          # Без --no-sign: вопреки описанию в справке CLI, этот флаг отключает
          # и подпись апдейтера тоже ("Updater signing is skipped due to --no-sign flag"),
          # а значит .sig не создаётся и latest.json собрать не из чего.
          args: --target ${{ matrix.target }}

      - name: Retry release build (bundle_dmg.sh flake)
        if: steps.release.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Prisma Desktop ${{ github.ref_name }}
          releaseBody: |
            ## Какую сборку скачать

            | Система | Для какого компьютера | Файл для установки |
            | --- | --- | --- |
            | macOS — Apple Silicon | Mac с чипом Apple M-серии (M1, M2, M3, M4 и новее), ARM64 | `Prisma_*_aarch64.dmg` |
            | macOS — Intel | Mac с процессором Intel, x64 | `Prisma_*_x64.dmg` |
            | Windows | ПК с процессором Intel или AMD, x64 | `Prisma_*_x64-setup.exe` или `Prisma_*_x64_en-US.msi` |
            | Windows — без установки | ПК с процессором Intel или AMD, x64 | `Prisma-portable-x64.zip` |
            | Linux | ПК с процессором Intel или AMD, x64 | `*_amd64.deb` или `*.x86_64.rpm` |

            На Mac тип процессора можно посмотреть в меню Apple → «Об этом Mac».
            `aarch64` означает ARM64 — это сборка для Apple Silicon.

            Файлы `.sig`, `latest.json` и `.app.tar.gz` предназначены для автообновления.
            Для обычной установки на Mac скачайте `.dmg`.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Verify macOS application signature
        if: matrix.platform == 'macos-14'
        run: bash scripts/verify-macos-signature.sh "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Prisma.app"

      - name: Create Windows portable zip
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $releaseDir = "src-tauri/target/${{ matrix.target }}/release"
          $portableDir = "$releaseDir/portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null

          Copy-Item "$releaseDir/Prisma.exe" "$portableDir/Prisma.exe" -Force
          Copy-Item "$releaseDir/media-tools" "$portableDir/media-tools" -Recurse -Force
          Copy-Item "$releaseDir/prisma-ffmpeg.exe" "$portableDir/prisma-ffmpeg.exe" -Force
          Copy-Item "$releaseDir/prisma-ffprobe.exe" "$portableDir/prisma-ffprobe.exe" -Force
          if (Test-Path "$releaseDir/WebView2Loader.dll") {
            Copy-Item "$releaseDir/WebView2Loader.dll" "$portableDir/WebView2Loader.dll" -Force
          }
          if (Test-Path "$releaseDir/resources") {
            Copy-Item "$releaseDir/resources" "$portableDir/resources" -Recurse -Force
          }

          Compress-Archive -Path "$portableDir/*" -DestinationPath "$releaseDir/bundle/nsis/Prisma-portable-x64.zip" -Force

      - name: Upload Windows portable to release
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/Prisma-portable-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
